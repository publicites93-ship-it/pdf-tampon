name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compiler l'APK de débogage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer le SDK Android (préinstallé sur ubuntu-latest)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK de débogage
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Vérifier et calculer l'empreinte SHA-256
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p artifact
          cp "$APK" artifact/PDF_Tampon-debug.apk
          sha256sum artifact/PDF_Tampon-debug.apk | tee artifact/PDF_Tampon-debug.apk.sha256

      - name: Publier l'APK dans les Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Tampon-debug-apk
          path: artifact/
          retention-days: 14
          if-no-files-found: error
